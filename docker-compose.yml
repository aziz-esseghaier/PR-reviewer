# PostgreSQL with pgvector for the PR reviewer.
# Start: docker compose up -d     Stop: docker compose down
# Settings come from .env (see .env.example).
name: pr-reviewer

services:
  postgres:
    # Official Postgres 18 image with the pgvector extension installed, pinned to pgvector 0.8.7.
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Bound to 127.0.0.1, so only this machine can reach the database.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named Docker volume, not a Windows folder: faster, and the data survives container removal.
      # Postgres 18 images keep their data under /var/lib/postgresql/18/docker, so we mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # "Healthy" means Postgres accepts connections, not just that the container started.
      # Checking over TCP (-h) skips the temporary server Postgres runs while it sets up a new volume.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      # The first start creates the database files and can take a minute on a slow disk.
      # Failed checks during this window don't count.
      start_period: 90s
      start_interval: 2s

volumes:
  pgdata:
