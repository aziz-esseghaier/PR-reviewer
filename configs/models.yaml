# LLM providers and named model profiles.
# Code and experiments pick a model by profile name. Each experiment uses one profile only.


# daily_reset: how the daily quota comes back. "gradual" refills it bit by bit over 24 h;
# a time and time zone resets it all at once. Left out, the last 24 hours are counted.
providers:
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    daily_reset: gradual  # reply headers show 1 of 1000 requests back every 86 s
  google:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    daily_reset: "00:00 America/Los_Angeles"  # Google resets at midnight Pacific

# Profile names follow <provider>-<model>
models:
  groq-gpt-oss-120b:
    provider: groq
    model: openai/gpt-oss-120b
    temperature: 0
    max_tokens: 1024
    limits:  # free tier; Groq reports 8000 tokens/min and 1000 requests/day in its headers
      requests_per_minute: 30
      tokens_per_minute: 8000
      requests_per_day: 1000
      tokens_per_day: 200000  # Groq's published free tier for this model

  # The setup agent's model: it proposes environment recipes and fixes. The same model and
  # daily quota as above, with room for gpt-oss's reasoning before the JSON reply.
  setup-gpt-oss-120b:
    provider: groq
    model: openai/gpt-oss-120b
    temperature: 0
    max_tokens: 2048
    limits:
      requests_per_minute: 30
      tokens_per_minute: 8000
      requests_per_day: 1000
      tokens_per_day: 200000

  # The reviewer's model, the same for every reviewer experiment so results compare. It shares
  # the daily quota above. Its thinking counts against max_tokens (2,000 was too few for big
  # PRs), and the prompt plus max_tokens must stay under 8,000 tokens a minute, which sets how
  # much of a PR fits.
  reviewer-gpt-oss-120b:
    provider: groq
    model: openai/gpt-oss-120b
    temperature: 0
    max_tokens: 3000
    reasoning_effort: medium
    limits:
      requests_per_minute: 30
      tokens_per_minute: 8000
      requests_per_day: 1000
      tokens_per_day: 200000

  # The evidence agent's model: the reviewer's model and reasoning, with more room for the
  # reply. A generated test sits inside the JSON reply, and at 3,000 tokens about half the
  # test writer's replies ran out while thinking. Requests get less room in return.
  evidence-gpt-oss-120b:
    provider: groq
    model: openai/gpt-oss-120b
    temperature: 0
    max_tokens: 4000
    reasoning_effort: medium
    limits:
      requests_per_minute: 30
      tokens_per_minute: 8000
      requests_per_day: 1000
      tokens_per_day: 200000

  # The same model as the judge below, so it isn't used as a reviewer in experiments.
  google-gemini-3.5-flash-lite:
    provider: google
    model: gemini-3.5-flash-lite
    temperature: 0
    max_tokens: 1024
    limits:  # free tier per AI Studio (2026-10-29): 15/min, 250K tokens/min, 500/day
      requests_per_minute: 15
      tokens_per_minute: 250000
      requests_per_day: 500

  # The SWR-Bench judge, fixed for the whole project (see results/judge-choice/). Settings are
  # SWR-Bench's scorer defaults. It shares the model's daily quota with the profile above.
  judge-gemini-3.5-flash-lite:
    provider: google
    model: gemini-3.5-flash-lite
    temperature: 0
    max_tokens: 8192
    limits:
      requests_per_minute: 15
      tokens_per_minute: 250000
      requests_per_day: 500
