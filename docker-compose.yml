# PostgreSQL with pgvector for the PR reviewer, plus pgAdmin to browse it.
# Start: docker compose up -d     Stop: docker compose down
# pgAdmin: http://127.0.0.1:5050 (log in with PGADMIN_EMAIL and PGADMIN_PASSWORD).
# Settings come from .env (see .env.example).
name: pr-reviewer

services:
  postgres:
    # Official Postgres 18 image with the pgvector extension installed, pinned to pgvector 0.8.7.
    image: pgvector/pgvector:0.8.7-pg18
    # Docker's small init program runs as the container's first process and cleans up leftover
    # processes. Without it Postgres is that process: it adopts a healthcheck left behind after a
    # timeout, and when that exits with an error, Postgres takes it for a crashed server process
    # and drops every connection.
    init: true
    # Start again after a crash or a restart of Docker or the PC, unless we stopped it ourselves.
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Bound to 127.0.0.1, so only this machine can reach the database.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named Docker volume, not a Windows folder: faster, and the data survives container removal.
      # Postgres 18 images keep their data under /var/lib/postgresql/18/docker, so we mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # "Healthy" means Postgres accepts connections, not just that the container started.
      # Checking over TCP (-h) skips the temporary server Postgres runs while it sets up a new volume.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      # The first start creates the database files and can take a minute on a slow disk.
      # Failed checks during this window don't count.
      start_period: 90s
      start_interval: 2s

  pgadmin:
    # Web tool to browse the tables, pinned to pgAdmin 9.18.0.
    image: dpage/pgadmin4:9.18.0
    restart: unless-stopped
    environment:
      # pgAdmin reads its login only on the first start, when it creates the pgadmin-data volume.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?set PGADMIN_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD in .env}
      # Skip the built-in mail server; it only sends password-reset emails.
      PGADMIN_DISABLE_POSTFIX: "true"
    ports:
      # Bound to 127.0.0.1, so only this machine can open it.
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    configs:
      # Adds our database to pgAdmin's server list on its first start.
      - source: pgadmin-servers
        target: /pgadmin4/servers.json
    volumes:
      # Keeps pgAdmin's login, settings and saved passwords.
      - pgadmin-data:/var/lib/pgadmin
    healthcheck:
      # "Healthy" means the web page answers. Until then, `docker compose ps` shows "starting".
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/misc/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The first start sets up pgAdmin's settings file and took about 10 minutes on a slow disk.
      start_period: 15m
      start_interval: 5s

configs:
  # Inside the Docker network, pgAdmin reaches the database by its service name, "postgres".
  # The password isn't stored here: pgAdmin asks for it once and can save it.
  pgadmin-servers:
    content: |
      {"Servers": {"1": {
        "Name": "pr-reviewer",
        "Group": "Servers",
        "Host": "postgres",
        "Port": 5432,
        "MaintenanceDB": "${POSTGRES_DB}",
        "Username": "${POSTGRES_USER}",
        "SSLMode": "prefer"
      }}}

volumes:
  pgdata:
  pgadmin-data:
