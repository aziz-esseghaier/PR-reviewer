[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-reviewer"
version = "0.1.0"
description = "Evidence-first AI pull-request reviewer for Python repos, measured on SWR-Bench."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
# Each milestone step adds the runtime dependencies it needs.
dependencies = [
    "psycopg[binary]>=3.2",  # PostgreSQL driver, also used by LangGraph's checkpointer
    "python-dotenv>=1.0",  # loads settings and keys from .env
    "openai>=3.40",  # official SDK, pointed at each provider's OpenAI-compatible endpoint
    "httpx2>=2.12",  # HTTP client under the OpenAI SDK (v3+); tests swap in a fake transport
    "pydantic>=2.14",  # validates configs, and later the LLM's JSON output
    "pyyaml>=6.0",  # reads configs/*.yaml
    "tzdata>=2025.2",  # time-zone data for daily quota resets; Windows has none built in
    "langgraph>=1.2",  # graphs of steps with typed state, loops and saved progress
    "langgraph-checkpoint-postgres>=3.2",  # saves graph progress in PostgreSQL, so runs can resume
    "langsmith>=0.14",  # traces graph runs and model calls to smith.langchain.com, when turned on
    # Imported by SWR-Bench's official scoring script (third_party/swrbench/evaluation_struct.py):
    "numpy>=2.0",
    "tqdm>=4.66",
    "loguru>=0.7",
    "docker>=7.2",  # Docker SDK: runs the sandbox containers that hold PR code
    "packaging>=24",  # reads Python version requirements, such as ">=3.8"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",  # type hints for pyyaml, used by mypy
    "types-docker",  # type hints for the Docker SDK, used by mypy
]

[project.scripts]
pr-reviewer = "pr_reviewer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pr_reviewer.db" = ["migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"
# SWR-Bench's own scripts, kept byte for byte as published; results/ holds run outputs, such
# as the model-written proof tests, kept exactly as they ran.
extend-exclude = ["third_party", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# The Docker SDK, not our docker/ folder of Dockerfiles.
known-third-party = ["docker"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
# Lets mypy understand pydantic models, for example their constructor arguments.
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs the PostgreSQL container from docker-compose.yml (skipped when it is not running)",
    "docker: starts sandbox containers, so needs Docker (skipped when it is not running)",
]
